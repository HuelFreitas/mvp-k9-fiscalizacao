services:
  - type: web
    runtime: node
    name: mvp-k9-fiscalizacao-api
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: DEMO_DEFAULT_PASSWORD
        sync: false
      - key: ALLOW_DEV_PASSWORDLESS_LOGIN
        value: "false"
      - key: DB_POOL_SIZE
        value: "5"

  - type: web
    runtime: static
    name: mvp-k9-fiscalizacao-web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
