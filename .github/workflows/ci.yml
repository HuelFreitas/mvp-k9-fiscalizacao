name: Testes e Cobertura

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master, develop ]
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run backend lint
        run: npm run lint:backend

  frontend-test:
    runs-on: ubuntu-latest
    needs: frontend-lint

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rodar testes com cobertura
        run: npm run test:coverage
        continue-on-error: false

      - name: Coletar total de testes
        if: success()
        run: |
          npx vitest --config vitest.config.cjs --run --reporter=json --outputFile=.vitest-results.json
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('.vitest-results.json','utf8'));fs.appendFileSync(process.env.GITHUB_ENV, 'TOTAL_TESTS=' + r.numTotalTests + '\n');"

      - name: Enviar cobertura para Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Comentar PR com resultado dos testes
        if: success() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ **Testes aprovados!**\n\n- Total executado: ${process.env.TOTAL_TESTS} testes\n- Veja o relatório de cobertura no Codecov\n- Rode \`npm run coverage\` localmente para abrir o relatório detalhado`
            })
        continue-on-error: true

  backend-test:
    runs-on: ubuntu-latest
    needs: backend-lint

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências do backend
        run: npm ci
        working-directory: backend

      - name: Rodar testes do backend
        run: npm run test:coverage
        working-directory: backend
        continue-on-error: false
